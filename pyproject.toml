[project]
name = "help-desk-agent"
version = "0.1.0"
description = "CityWheels Help Desk AI Agent with Gemini and Tool Calling"
readme = "README.md"
authors = [
    { name = "Oliwer Urbaniak", email = "oliwerx12@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
help-desk-agent = "help_desk_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
